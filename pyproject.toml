[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pairs-trading"                # distribution name (what pip installs)
version = "0.1.0"
description = "Dynamic-hedge pairs trading toolkit"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Mengren Man"}]
# Everything imported at module top by pairs.stats / pairs.models / pairs.strategies.
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "statsmodels>=0.14",   # Engle-Granger / Johansen / ADF / KPSS
  "pykalman>=0.9.7",     # Kalman dynamic hedge ratio
  "joblib>=1.3",
  "tqdm>=4.66",
  "threadpoolctl>=3.1",
]

[project.optional-dependencies]
# Polygon.io parquet-lake loader (pairs.market_data.polygon_lake)
polygon = ["pyarrow>=14"]
# pairs.plotting
plot = ["matplotlib>=3.7"]
# Everything the research notebooks use (OpenBB is only needed by the openbb loader)
notebooks = [
  "jupyterlab",
  "matplotlib>=3.7",
  "seaborn>=0.13",
  "networkx>=3.0",
  "pyarrow>=14",
  "openbb>=4 ; python_version >= '3.9'",
]
test = ["pytest>=7"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["pairs*"]

# include your packaged ticker lists
[tool.setuptools.package-data]
pairs = ["universes/tickers/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
norecursedirs = ["pairs", "notebooks", "figures", ".git", "__pycache__", "*.egg-info"]
# The production function test_spread_stationarity() in pairs.stats.stationarity
# causes a false-positive fixture error because pytest inspects imported names starting
# with "test_". The error is harmless (it's not a test), so we treat it as expected.
addopts = ["--ignore=pairs"]
